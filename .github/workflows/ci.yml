name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore JobTracker.sln

      - name: Build backend
        run: dotnet build JobTracker.sln --configuration Release --no-restore

      - name: Pull PostgreSQL test image
        run: docker pull postgres:16

      - name: Test backend with coverage
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: dotnet test JobTracker.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-code-coverage
          path: backend/JobTracker.Tests/TestResults/**/coverage.cobertura.xml

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm run test:run