name: Backend CI

on:
  push:
    branches:
      - main
      - dev
      - backend
      - frontend
  pull_request:
    branches:
      - main
      - dev
      - backend
      - frontend

jobs:
  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore JobTracker.sln

      - name: Build
        run: dotnet build JobTracker.sln --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test JobTracker.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-code-coverage
          path: backend/JobTracker.Tests/TestResults/**/coverage.cobertura.xml